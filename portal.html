<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>KUCHE — App con Inicio de Sesión</title>
  
  <!-- PWA & Meta Tags -->
  <link rel="manifest" href="./static/manifest.json">
  <meta name="theme-color" content="#131113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KUCHE App">
  <link rel="apple-touch-icon" href="./static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./static/icons/icon-192.png">
  
  <!-- Tipografía Montserrat y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/styles.css?v=8.0">

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       PANTALLA DE LOGIN BÁSICO
       ═══════════════════════════════════════════════════════════════════ */
    .auth-overlay-view {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      background: var(--bg-base);
      transition: background-color 0.25s;
    }

    .auth-card-box {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: 14px;
      padding: 32px 26px;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: background-color 0.25s, border-color 0.25s;
    }

    .auth-header-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7e1741 0%, #9B2247 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(155, 34, 71, 0.4);
    }

    .auth-brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--guinda-primary);
      margin: 0;
      line-height: 1;
    }

    .auth-brand-sub {
      font-size: 11.5px;
      color: var(--dorado-accent);
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 6px;
      display: block;
    }

    .auth-form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .auth-form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--dorado-accent);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .auth-input-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 13.5px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .auth-input-field:focus {
      border-color: var(--dorado-accent);
      box-shadow: 0 0 0 2px rgba(230, 209, 148, 0.25);
    }

    .auth-remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 22px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .auth-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .auth-btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #7e1741 0%, #9B2247 100%);
      border: 1px solid var(--dorado-accent);
      color: #FFFFFF;
      padding: 13px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(155, 34, 71, 0.4);
    }

    .auth-btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    /* Barra Superior Usuario Activo */
    .official-badge-strip {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-medium);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
      font-size: 11px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body class="theme-dark">

<!-- ================================================================
     1. PANTALLA DE INICIO DE SESIÓN BÁSICO
     ================================================================ -->
<div id="view-auth-container" class="auth-overlay-view">
  <!-- Botón Flotante para Alternar Tema en Pantalla de Login -->
  <div style="position:fixed; top:18px; right:22px; z-index:10000;">
    <button id="btn-auth-theme-toggle" class="btn-theme-pill" onclick="alternarTema()" title="Alternar entre Modo Oscuro y Modo Claro">
      ☀️ Modo Claro
    </button>
  </div>

  <div class="auth-card-box">
    
    <div class="auth-header-brand">
      <div class="auth-brand-icon">
        <svg viewBox="0 0 24 24" style="width:24px; height:24px; color:#fff;"><path d="M9 18h6m-4 3h2m-5-8.5a6 6 0 1 1 8 0c-.8 1-1.5 2-1.5 3.5h-5c0-1.5-.7-2.5-1.5-3.5z" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="auth-brand-title">KUCHE</h1>
      <span class="auth-brand-sub">Sistema de Alumbrado Público</span>
    </div>

    <!-- FORMULARIO DE LOGIN BÁSICO -->
    <form id="form-login" onsubmit="handleLoginSubmit(event)">
      <div class="auth-form-group">
        <label class="auth-form-label" for="login-user">Usuario o Correo</label>
        <input type="text" id="login-user" class="auth-input-field" placeholder="ej. usuario@kuche.gob.mx o admin" required>
      </div>

      <div class="auth-form-group">
        <label class="auth-form-label" for="login-password">Contraseña</label>
        <input type="password" id="login-password" class="auth-input-field" placeholder="••••••••" required>
      </div>

      <div class="auth-remember-row">
        <label class="auth-checkbox-label">
          <input type="checkbox" id="login-remember" checked>
          <span>Recordar sesión</span>
        </label>
      </div>

      <button type="submit" class="auth-btn-primary">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>

<!-- ================================================================
     2. APP DE INSPECCIÓN TRAS INICIAR SESIÓN
     ================================================================ -->
<div id="view-app-container" class="app-wrapper" style="display:none;">
  
  <!-- BANNER DE USUARIO ACTIVO -->
  <div class="official-badge-strip">
    <div class="user-meta">
      <span style="width:8px; height:8px; border-radius:50%; background:#10B981; display:inline-block; box-shadow:0 0 6px #10B981;"></span>
      <div>
        <strong id="badge-user-name" style="color:var(--dorado-accent);">Usuario Activo</strong>
        <span style="opacity:0.75; font-size:10px;"> &bull; Sesión iniciada</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="btn-theme-toggle" class="btn-theme-pill" onclick="alternarTema()" title="Alternar entre Modo Oscuro y Modo Claro" style="padding:4px 10px; font-size:10px;">
        ☀️ Modo Claro
      </button>
      <button onclick="cerrarSesion()" style="background:#ef4444; border:none; color:#fff; border-radius:4px; padding:4px 10px; font-size:10px; font-weight:700; cursor:pointer;" title="Cerrar sesión actual">Salir</button>
    </div>
  </div>

  <!-- BARRA SUPERIOR / NAVBAR -->
  <header class="app-header">
    <div class="brand-group">
      <div class="brand-text">
        <h1 class="brand-kuche-wordmark">KUCHE</h1>
        <p>Estación de Inspección y Auditoría</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button id="btn-instalar-pwa" class="btn-instalar-pwa" style="display:none;" title="Instalar Aplicación en Pantalla de Inicio">
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:13px; height:13px; stroke-width:2.5;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Instalar</span>
      </button>
    </div>
  </header>

  <!-- SELECTOR DE MODOS (TABS SEGMENTADOS) -->
  <div class="tabs-container">
    <div class="segmented-control tabs">
      <button class="tab activa" id="tab-video" onclick="cambiarModo('video')">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <span>Video</span>
      </button>
      <button class="tab" id="tab-foto" onclick="cambiarModo('foto')">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="13" r="4"/>
          <path d="M5 7h2l2-3h6l2 3h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
        </svg>
        <span>Foto</span>
      </button>
      <button class="tab" id="tab-manual" onclick="cambiarModo('manual')">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Manual</span>
      </button>
    </div>
    <button id="btn-cam-toggle" class="btn-cam-toggle" onclick="toggleCamara()">
      <span class="dot-indicator"></span>
      <span>Camara: ON</span>
    </button>
  </div>

  <!-- VISOR DE CÁMARA / CANVAS -->
  <div id="visor-container">
    <div class="hud-reticle hud-tl"></div>
    <div class="hud-reticle hud-tr"></div>
    <div class="hud-reticle hud-bl"></div>
    <div class="hud-reticle hud-br"></div>
    <canvas id="canvas"></canvas>
    <div id="progress-bar"></div>
  </div>
  <div id="manual-preview" style="display:none">
    <svg class="icon-svg" viewBox="0 0 24 24" style="width:32px; height:32px; opacity:0.4;">
      <path d="M1 1l22 22"/>
      <path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34m-7.72-2.06a4 4 0 1 1-5.56-5.56"/>
    </svg>
    <span>Camara desactivada</span>
  </div>

  <!-- CONTROL DE MODO VIDEO (MÁXIMO 10 SEGUNDOS) -->
  <div id="sec-video">
    <button id="btn-grabar-video" class="btn-record" onclick="toggleGrabacionVideo()">
      <span id="ico-grabar"><span class="rec-pulse-icon"></span></span>
      <span id="txt-grabar">Iniciar Grabacion (10s con IA)</span>
    </button>
  </div>

  <!-- ESTADO DE LA IA -->
  <div id="live">Iniciando sistema...</div>

  <!-- SECCIÓN MODO FOTO -->
  <div id="sec-foto">
    <button onclick="capturarFoto()" class="btn-primary-action">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Capturar y Analizar Foto</span>
    </button>
    <label class="btn-file-upload">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span>Subir imagen desde archivo</span>
      <input type="file" id="file" accept="image/*" hidden>
    </label>
  </div>

  <!-- SECCIÓN MODO MANUAL -->
  <div id="sec-manual">
    <div>
      <label class="form-label" for="infra-categoria-manual">Tipo de Luminaria / Incidencia</label>
      <select id="infra-categoria-manual" class="input-select">
        <option value="Luminaria LED Vial">Luminaria LED Vial Apagada</option>
        <option value="Luminaria Colonial">Luminaria Colonial / Farol Apagado</option>
        <option value="Luminaria Solar">Luminaria Solar Sin Carga</option>
        <option value="Fotocelda Averiada">Fotocelda Averiada / Intermitente</option>
        <option value="Brazo de Luminaria Dañado">Brazo / Soporte de Luminaria Afectado</option>
      </select>
    </div>
    <div>
      <label class="form-label" for="desc-manual">Crucero o Notas de Campo</label>
      <textarea id="desc-manual" class="input-textarea" placeholder="Ej. Av. Reforma esquina Calle 5 de Mayo..."></textarea>
    </div>
    <button onclick="enviarReporteManual()" class="btn-primary-action">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      <span>Registrar Reporte</span>
    </button>
  </div>

  <!-- PANEL MODAL DE REPORTE IA (TRAS DETECCIÓN) -->
  <div id="panel-reporte">
    <div class="panel-title-badge">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>Luminaria Detectada por IA</span>
    </div>

    <!-- Foto congelada con la detección -->
    <img id="reporte-img" alt="Luminaria detectada">

    <!-- Categoría -->
    <div style="margin-bottom:8px;">
      <label class="form-label" for="reporte-categoria">Categoría</label>
      <select id="reporte-categoria" class="input-select">
        <option value="Luminaria LED Vial">Luminaria LED Vial Apagada</option>
        <option value="Luminaria Colonial">Luminaria Colonial Apagada</option>
        <option value="Luminaria Solar">Luminaria Solar Sin Carga</option>
        <option value="Fotocelda Averiada">Fotocelda Averiada / Intermitente</option>
        <option value="Brazo de Luminaria Dañado">Brazo / Soporte de Luminaria Afectado</option>
      </select>
    </div>

    <!-- Confianza IA -->
    <div id="reporte-conf"></div>

    <!-- Descripción adicional -->
    <div style="margin-bottom:12px;">
      <label class="form-label" for="reporte-desc">Notas de campo (opcional)</label>
      <textarea id="reporte-desc" class="input-textarea" placeholder="Crucero o condición del foco..." rows="2"></textarea>
    </div>

    <button onclick="enviarReporteIA()" class="btn-submit-report">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      <span>Confirmar y Enviar Reporte</span>
    </button>
    <button onclick="descartarReporte()" class="btn-discard-report">
      Descartar
    </button>
  </div>

  <!-- CONSOLA DE DIAGNÓSTICO -->
  <div id="log-panel"></div>

  <!-- TOAST DE CONFIRMACIÓN -->
  <div id="toast-ok">
    <svg class="icon-svg" viewBox="0 0 24 24" style="color:var(--green); stroke-width:3;">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span>Reporte guardado con éxito</span>
  </div>

  <video id="video" autoplay playsinline muted hidden></video>
</div>

<!-- Scripts Kuche: Puente API y Lógica PWA -->
<script src="./static/kuche-api.js"></script>
<script src="./static/app.js?v=8.0"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════
// SISTEMA DE LOGIN BÁSICO KUCHE
// ═══════════════════════════════════════════════════════════════════════

let sesionActual = null;

// Conmutador de Tema (Modo Oscuro / Modo Claro)
function alternarTema() {
  const esOscuro = !document.body.classList.contains('theme-light');
  const nuevo = esOscuro ? 'light' : 'dark';
  aplicarTema(nuevo);
  localStorage.setItem('kuche_theme_pref', nuevo);
}

function aplicarTema(tema) {
  document.body.classList.remove('theme-dark', 'theme-light');
  document.body.classList.add(tema === 'light' ? 'theme-light' : 'theme-dark');
  
  const btns = [document.getElementById('btn-theme-toggle'), document.getElementById('btn-auth-theme-toggle')];
  btns.forEach(btn => {
    if (btn) {
      btn.innerHTML = tema === 'light' ? '🌙 Modo Oscuro' : '☀️ Modo Claro';
    }
  });

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    metaTheme.setAttribute('content', tema === 'light' ? '#FFFFFF' : '#131113');
  }
}

// Iniciar sesión básico
function handleLoginSubmit(e) {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pwd = document.getElementById('login-password').value;
  const remember = document.getElementById('login-remember').checked;

  if (!user || !pwd) {
    alert('Por favor ingresa usuario y contraseña.');
    return;
  }

  sesionActual = {
    user: user,
    nombre: user.includes('@') ? user.split('@')[0] : user,
    remember: remember,
    loginAt: new Date().toISOString()
  };

  if (remember) {
    localStorage.setItem('kuche_basic_session', JSON.stringify(sesionActual));
  } else {
    sessionStorage.setItem('kuche_basic_session', JSON.stringify(sesionActual));
  }

  activarVistaApp(sesionActual);
}

// Activar vista de app
function activarVistaApp(sesion) {
  document.getElementById('view-auth-container').style.display = 'none';
  document.getElementById('view-app-container').style.display = 'block';

  const badgeEl = document.getElementById('badge-user-name');
  if (badgeEl) badgeEl.textContent = sesion.nombre || sesion.user;

  if (typeof iniciarCamara === 'function') {
    iniciarCamara();
  }
}

// Cerrar sesión
function cerrarSesion() {
  localStorage.removeItem('kuche_basic_session');
  sessionStorage.removeItem('kuche_basic_session');
  sesionActual = null;

  if (typeof detenerCamara === 'function') {
    detenerCamara();
  }

  document.getElementById('view-app-container').style.display = 'none';
  document.getElementById('view-auth-container').style.display = 'flex';
}

// Comprobar sesión al cargar
window.addEventListener('DOMContentLoaded', () => {
  const guardadoTema = localStorage.getItem('kuche_theme_pref') || 'dark';
  aplicarTema(guardadoTema);

  const guardada = localStorage.getItem('kuche_basic_session') || sessionStorage.getItem('kuche_basic_session');
  if (guardada) {
    try {
      const parsed = JSON.parse(guardada);
      if (parsed && (parsed.user || parsed.nombre)) {
        sesionActual = parsed;
        activarVistaApp(sesionActual);
      }
    } catch(e) {}
  }
});

window.addEventListener('storage', (e) => {
  if (e.key === 'kuche_theme_pref') {
    aplicarTema(e.newValue || 'dark');
  }
});
</script>
</body>
</html>
