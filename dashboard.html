<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KUCHE — Sala GIS de Luminarias y Alumbrado Público</title>
  
  <!-- PWA & Meta Tags -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#611232">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KUCHE">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root, body.theme-dark {
      --bg: #131113;
      --panel: #1B181A;
      --card: #252124;
      --border: #2E292C;
      --border-hover: #E6D194;
      --header-bg: #1B181A;
      --cyan: #E6D194;
      --cyan-glow: rgba(230, 209, 148, 0.25);
      --green: #E6D194;
      --green-glow: rgba(230, 209, 148, 0.25);
      --orange: #f59e0b;
      --orange-glow: rgba(245, 158, 11, 0.25);
      --red: #9B2247;
      --red-glow: rgba(155, 34, 71, 0.35);
      --text: #F1ECEE;
      --text-muted: #A69CA1;
      --dorado-accent: #E6D194;
      --guinda-primary: #9B2247;
      --radius-sm: 6px;
      --radius-md: 10px;
    }
    
    body.theme-light {
      --bg: #F8F9FA;
      --panel: #FFFFFF;
      --card: #F3F4F6;
      --border: #E5E7EB;
      --border-hover: #9B2247;
      --header-bg: #FFFFFF;
      --cyan: #9B2247;
      --cyan-glow: rgba(155, 34, 71, 0.2);
      --green: #BC955C;
      --green-glow: rgba(188, 149, 92, 0.25);
      --orange: #d97706;
      --orange-glow: rgba(217, 119, 6, 0.2);
      --red: #9B2247;
      --red-glow: rgba(155, 34, 71, 0.25);
      --text: #111827;
      --text-muted: #6B7280;
      --dorado-accent: #BC955C;
      --guinda-primary: #9B2247;
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    .btn-theme-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--dorado-accent);
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-theme-pill:hover {
      border-color: var(--dorado-accent);
      background: var(--panel);
      transform: translateY(-1px);
    }
    body.theme-light .btn-theme-pill {
      border: 1px solid #E5E7EB;
      background: #FFFFFF;
      color: #9B2247;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    body.theme-light .btn-theme-pill:hover {
      border-color: #9B2247;
      background: #F9FAFB;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s, color 0.25s;
    }

    /* ── Header ── */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      transition: background 0.25s;
    }
    
    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }
    header h1 small {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: normal;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .badge-live {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(16, 185, 129, 0.1);
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    
    .btn-action-report {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(0, 210, 255, 0.35);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-action-report:hover {
      background: var(--cyan);
      color: #000;
      transform: translateY(-1px);
    }

    #btn-refresh {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    #btn-refresh:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* ── Layout principal ── */
    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
      position: relative;
    }

    /* ── Sidebar ── */
    aside {
      width: 360px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.2);
    }
    .stat-box {
      padding: 12px 8px;
      text-align: center;
      border-right: 1px solid var(--border);
      transition: background 0.2s;
    }
    .stat-box:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 700; line-height: 1; font-family: 'JetBrains Mono', monospace; }
    .stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

    /* ── Filtros ── */
    .filtros {
      padding: 10px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.1);
    }
    .filtro-btn {
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filtro-btn.active {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }
    .filtro-btn:hover:not(.active) {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .sidebar-title {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #lista-reportes {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }
    #lista-reportes::-webkit-scrollbar { width: 4px; }
    #lista-reportes::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 2px; }

    .reporte-card {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      position: relative;
    }
    .reporte-card:hover {
      background: rgba(230, 209, 148, 0.05);
    }
    .reporte-card.selected {
      background: rgba(155, 34, 71, 0.12);
      border-left: 3px solid var(--guinda-primary);
    }

    /* Miniatura de Foto en la Tarjeta */
    .card-thumb-box {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      cursor: zoom-in;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .card-thumb:hover {
      transform: scale(1.12);
    }
    .card-thumb-placeholder {
      color: var(--text-muted);
      font-size: 9px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      line-height: 1.1;
    }

    .cat-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-led        { background: #9B2247; box-shadow: 0 0 8px #9B2247; }
    .dot-colonial   { background: #BC955C; box-shadow: 0 0 8px #BC955C; }
    .dot-solar      { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot-fotocelda  { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .dot-otro       { background: var(--text-muted); }

    .card-info { flex: 1; min-width: 0; }
    .card-titulo {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Caja de Falla Escrita por el Ciudadano / Inspector */
    .card-falla-box {
      margin-top: 5px;
      padding: 6px 9px;
      border-radius: 5px;
      background: rgba(155, 34, 71, 0.16);
      border: 1px solid rgba(155, 34, 71, 0.35);
      font-size: 11px;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }
    .card-falla-label {
      font-weight: 800;
      color: #ff809b;
      margin-right: 4px;
    }
    body.theme-light .card-falla-box {
      background: #fdf2f4;
      border: 1px solid #fecdd3;
      color: #881337;
    }
    body.theme-light .card-falla-label {
      color: #9B2247;
    }

    .card-ref-box {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .card-ref-label {
      font-weight: 600;
      color: var(--dorado-accent);
    }

    /* Insignias de Autor: Oficial vs Versión Demo */
    .badge-autor {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-autor-oficial {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .badge-autor-demo {
      background: rgba(230, 209, 148, 0.12);
      color: var(--dorado-accent);
      border: 1px solid rgba(230, 209, 148, 0.3);
    }

    .card-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Modal Visor de Fotos */
    .foto-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .foto-modal-content {
      width: 100%;
      max-width: 620px;
      background: var(--panel);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    .foto-modal-img {
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #000;
    }
    .foto-modal-footer {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }

    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Contenedor del Mapa ── */
    #map-wrapper {
      flex: 1;
      height: 100%;
      position: relative;
      background: #090d16;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #090d16;
    }

    /* ── Filtro Dark Mode para tiles OSM (Sin marcas de agua y 100% libre) ── */
    #map.dark-tiles .leaflet-tile-pane {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.25) brightness(0.75);
    }

    /* ── Estilos Dark Mode para Controles de Leaflet ── */
    .leaflet-bar {
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5) !important;
    }
    .leaflet-bar a {
      background-color: var(--card) !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
      transition: background 0.15s, color 0.15s;
    }
    .leaflet-bar a:hover {
      background-color: var(--panel) !important;
      color: var(--cyan) !important;
    }
    .leaflet-control-layers {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
      color: var(--text) !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6) !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 11px !important;
      padding: 8px 12px !important;
    }
    .leaflet-control-layers label {
      margin: 4px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .leaflet-control-attribution {
      background: rgba(9, 13, 22, 0.85) !important;
      color: var(--text-muted) !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a {
      color: var(--cyan) !important;
    }

    /* ── Popups Leaflet ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      color: var(--text) !important;
      border: 1px solid var(--border-hover) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
      padding: 4px;
    }
    .leaflet-popup-tip { background: var(--panel) !important; }
    .popup-body {
      padding: 10px 12px;
      font-family: 'Inter', sans-serif;
      min-width: 220px;
      max-width: 280px;
    }
    .popup-header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .popup-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .popup-body h4 {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 6px 0;
      line-height: 1.3;
    }
    .popup-falla-box {
      background: rgba(155, 34, 71, 0.16);
      border: 1px solid rgba(155, 34, 71, 0.35);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.35;
      margin: 6px 0;
      color: var(--text);
      word-break: break-word;
    }
    body.theme-light .popup-falla-box {
      background: #fdf2f4;
      border: 1px solid #fecdd3;
      color: #881337;
    }
    .popup-body img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-top: 8px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      transition: opacity 0.2s;
    }
    .popup-body img:hover {
      opacity: 0.88;
    }
    .popup-coords {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--cyan);
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      font-weight: 600;
    }
    .popup-coords:hover {
      text-decoration: underline;
    }

    /* Iconos SVG */
    .icon-svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

<header>
  <div class="brand-left">
    <div>
      <h1 style="font-family:'Montserrat', sans-serif; font-size:22px; font-weight:900; letter-spacing:2px; color:#BC955C; margin:0; line-height:1;"><span style="color:#E6D194;">KUCHE</span></h1>
      <small style="font-size:11px; color:var(--text-muted); font-weight:600; display:block; margin-top:3px;">SISTEMA DE LUMINARIAS Y ALUMBRADO PÚBLICO</small>
    </div>
  </div>
  <div class="header-right">
    <div class="badge-live">
      <div class="dot-live"></div>
      <span>EN VIVO</span>
    </div>
    <button id="btn-theme-toggle" class="btn-theme-pill" onclick="alternarTemaDashboard()" title="Alternar entre Modo Oscuro y Modo Claro">
      Modo Claro
    </button>
    <button id="btn-refresh" onclick="cargarDatos()">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      <span>Actualizar</span>
    </button>
  </div>
</header>

<main>
  <aside>
    <!-- Métricas Generales -->
    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-num" id="stat-total" style="color:var(--text)">0</div>
        <div class="stat-lbl">Total</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-apagadas" style="color:#ef4444">0</div>
        <div class="stat-lbl">Apagadas</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-operativas" style="color:#10b981">0</div>
        <div class="stat-lbl">Operativas</div>
      </div>
    </div>
 
    <div class="sidebar-title">
      <span>LUMINARIAS REGISTRADAS</span>
      <span id="count-badge" style="color:var(--cyan); font-family:'JetBrains Mono', monospace;">0</span>
    </div>

    <!-- Filtros por Estado de Ticket Operativo -->
    <div class="filtros">
      <button class="filtro-btn active" id="flt-todos" onclick="cambiarFiltro('todos')">Todas</button>
      <button class="filtro-btn" id="flt-reportada" onclick="cambiarFiltro('Reportada')">Reportadas</button>
      <button class="filtro-btn" id="flt-revision" onclick="cambiarFiltro('En Revisión')">En Revisión</button>
      <button class="filtro-btn" id="flt-reparada" onclick="cambiarFiltro('Reparada')">Reparadas</button>
    </div>

    <div id="lista-reportes">
      <div class="empty-state">Cargando luminarias...</div>
    </div>
  </aside>

  <!-- MAPA INTERACTIVO -->
  <div id="map-wrapper">
    <div id="map"></div>
  </div>
</main>

<!-- Modal Visor de Foto en Alta Definición -->
<div id="foto-modal" class="foto-modal-overlay" style="display:none;" onclick="cerrarModalFoto()">
  <div class="foto-modal-content" onclick="event.stopPropagation()">
    <div style="padding:14px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border);">
      <div>
        <h3 id="foto-modal-titulo" style="font-size:14px; font-weight:700; margin:0; color:var(--text);">Evidencia Fotográfica</h3>
        <small id="foto-modal-sub" style="color:var(--text-muted); font-size:11px;">Fotografía registrada en campo</small>
      </div>
      <button type="button" onclick="cerrarModalFoto()" style="background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--text); cursor:pointer; font-size:12px; font-weight:700; padding:6px 14px; border-radius:6px; transition:background 0.2s;">Cerrar</button>
    </div>
    <div style="text-align:center; background:#000; padding:8px;">
      <img id="foto-modal-img" class="foto-modal-img" src="" alt="Evidencia de luminaria">
    </div>
    <div class="foto-modal-footer">
      <span id="foto-modal-autor" class="badge-autor"></span>
      <a id="foto-modal-link" href="#" target="_blank" class="btn-action-report" style="font-size:11px; padding:6px 14px;">Abrir original en nueva pestaña</a>
    </div>
  </div>
</div>

<script src="./static/kuche-api.js"></script>
<script>
// ── Variables globales ────────────────────────────────────────────
let mapaActivo, markersLayer;
let todosReportes = [];
let filtroActivo  = 'todos';
let markersMap    = {};

// ── Inicializar mapa interactivo (Puebla) ────────────────────────
function inicializarMapa() {
  const container = document.getElementById('map');
  if (!container) return;

  mapaActivo = L.map('map', { 
    zoomControl: false,
    preferCanvas: true
  }).setView([19.0414, -98.2063], 13);

  // Capas base 100% libres (Sin API Keys ni marcas de agua)
  const osmDark = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
  });

  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: '&copy; Esri &mdash; World Imagery'
  });

  const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
  });

  // Capa inicial por defecto: Dark Mode
  osmDark.addTo(mapaActivo);
  container.classList.add('dark-tiles');

  // Control selector de mapas
  const baseLayers = {
    "Modo Oscuro": osmDark,
    "Satelite HD": esriSat,
    "Calles Claras": osmStandard
  };

  L.control.layers(baseLayers, null, { position: 'topright', collapsed: true }).addTo(mapaActivo);
  L.control.zoom({ position: 'topright' }).addTo(mapaActivo);

  // Ajustar filtro Dark según capa activa
  mapaActivo.on('baselayerchange', function(e) {
    if (e.name === 'Modo Oscuro') {
      container.classList.add('dark-tiles');
    } else {
      container.classList.remove('dark-tiles');
    }
  });

  if (typeof L.markerClusterGroup === 'function') {
    markersLayer = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 40,
      spiderfyOnMaxZoom: true
    }).addTo(mapaActivo);
  } else {
    markersLayer = L.layerGroup().addTo(mapaActivo);
  }

  // Asegurar renderizado correcto al redimensionar
  window.addEventListener('resize', () => {
    if (mapaActivo) mapaActivo.invalidateSize();
  });
  setTimeout(() => { if (mapaActivo) mapaActivo.invalidateSize(); }, 300);
}

// ── Utilidades de Categoría de Luminaria (Sin emojis) ──────────────
// ── Icono Institucional para Marcadores en Mapa según Estado de Ticket ─
function getMarkerIcon(estadoTicket) {
  const st = estadoTicket || 'Reportada';
  const colorBorde = st === 'Reparada' ? '#10b981' : (st === 'En Revisión' ? '#f59e0b' : '#9B2247');
  const colorGlow = st === 'Reparada' ? 'rgba(16, 185, 129, 0.6)' : (st === 'En Revisión' ? 'rgba(245, 158, 11, 0.6)' : 'rgba(155, 34, 71, 0.7)');

  return L.divIcon({
    className: 'custom-map-pin',
    html: `<div style="
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(19, 17, 19, 0.9); border: 2.5px solid ${colorBorde};
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px ${colorGlow};
      cursor: pointer;
    ">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: ${colorBorde};"></div>
    </div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 13],
    popupAnchor: [0, -14]
  });
}

// ── Cargar datos del servidor ─────────────────────────────────────
async function cargarDatos() {
  try {
    const targetUrl = window.KucheAPI ? window.KucheAPI.apiUrl('/api/infraestructura/historial?page=0') : '/api/infraestructura/historial?page=0';
    const resp = await fetch(targetUrl);
    if (!resp.ok) {
      console.warn('Respuesta no exitosa del servidor:', resp.status);
      document.getElementById('lista-reportes').innerHTML = '<div class="empty-state">No se pudieron cargar los datos (HTTP ' + resp.status + '). Reintentando...</div>';
      return;
    }
    const j = await resp.json();
    let lista = [];
    if (Array.isArray(j)) {
      lista = j;
    } else if (Array.isArray(j.historial)) {
      lista = j.historial;
    } else if (j.historial && Array.isArray(j.historial.historial)) {
      lista = j.historial.historial;
    }
    todosReportes = lista.filter(r => r.estado_registro !== 'Borrada');
    actualizarEstadisticas();
    renderLista();
    renderMapa();
  } catch(e) {
    console.error('Error cargando datos:', e);
    document.getElementById('lista-reportes').innerHTML = '<div class="empty-state">Error de conexion al cargar datos. Verifica la conexion con el servidor.</div>';
  }
}

// ── Estadísticas ──────────────────────────────────────────────────
function actualizarEstadisticas() {
  document.getElementById('stat-total').textContent = todosReportes.length;
  document.getElementById('stat-apagadas').textContent =
    todosReportes.filter(r => (r.estado_ticket || 'Reportada') === 'Reportada').length;
  document.getElementById('stat-operativas').textContent =
    todosReportes.filter(r => (r.estado_ticket || '') === 'Reparada').length;
}

function reportesFiltrados() {
  if (filtroActivo === 'todos') return todosReportes;
  return todosReportes.filter(r => (r.estado_ticket || 'Reportada') === filtroActivo);
}

function cambiarFiltro(nuevoFiltro) {
  filtroActivo = nuevoFiltro;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
  const idBtn = nuevoFiltro === 'todos' ? 'flt-todos' :
                nuevoFiltro === 'Reportada' ? 'flt-reportada' :
                nuevoFiltro === 'En Revisión' ? 'flt-revision' : 'flt-reparada';
  const btn = document.getElementById(idBtn);
  if (btn) btn.classList.add('active');
  renderLista();
  renderMapa();
}

async function cambiarEstadoLuminaria(id, nuevoEstado) {
  try {
    const url = window.KucheAPI ? window.KucheAPI.apiUrl('/api/infraestructura/cambiar_estado') : '/api/infraestructura/cambiar_estado';
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, estado_ticket: nuevoEstado })
    });
    if (resp.ok) {
      await cargarDatos();
    }
  } catch(e) {
    console.error('Error cambiando estado:', e);
  }
}

// ── Desglose Inteligente del Reporte ──────────────────────────────
function desglosarReporte(r) {
  const textoPrincipal = (r.luminaria || r.incidencia || r.placa || 'Luminaria Registrada').trim();
  let tipoIA = 'Luminaria Detectada';
  let fallaEscrita = (r.falla || '').trim();
  let referencia = (r.referencia || '').trim();

  if (textoPrincipal.includes(' | ')) {
    const partes = textoPrincipal.split(' | ');
    tipoIA = partes[0].trim();
    const resto = partes.slice(1).join(' | ').trim();
    if (resto.includes(' — Referencia: ')) {
      const sub = resto.split(' — Referencia: ');
      fallaEscrita = sub[0].trim();
      referencia = sub[1].trim();
    } else if (resto.includes(' - Referencia: ')) {
      const sub = resto.split(' - Referencia: ');
      fallaEscrita = sub[0].trim();
      referencia = sub[1].trim();
    } else {
      fallaEscrita = resto;
    }
  } else {
    tipoIA = textoPrincipal;
  }

  if (!fallaEscrita && r.incidencia && r.incidencia !== textoPrincipal) {
    fallaEscrita = r.incidencia.trim();
  }
  if (!fallaEscrita) {
    fallaEscrita = 'Sin descripción de falla especificada';
  }

  // Identificación de Autor vs Versión Demo
  const rawUser = (r.usuario || '').trim();
  const esDemo = !rawUser || 
                 rawUser.toLowerCase() === 'versión demo' || 
                 rawUser.toLowerCase() === 'version demo' || 
                 rawUser.toLowerCase() === 'demo' || 
                 rawUser.toLowerCase() === 'ciudadano' || 
                 rawUser.toLowerCase() === 'anonimo';
  const usuarioLabel = esDemo ? 'Versión Demo' : rawUser;

  // Resolución de URL de Fotografía mediante window.KucheAPI
  let fotoUrl = '';
  if (r.foto && typeof r.foto === 'string' && r.foto.trim()) {
    const limpia = r.foto.trim();
    fotoUrl = window.KucheAPI ? window.KucheAPI.apiUrl(limpia) : limpia;
  }

  return {
    tipoIA,
    fallaEscrita,
    referencia,
    usuarioLabel,
    esDemo,
    fotoUrl
  };
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ── Lista de reportes ─────────────────────────────────────────────
function renderLista() {
  const lista = document.getElementById('lista-reportes');
  const datos = reportesFiltrados();
  document.getElementById('count-badge').textContent = datos.length;

  if (!datos.length) {
    lista.innerHTML = '<div class="empty-state">No hay luminarias registradas.</div>';
    return;
  }

  lista.innerHTML = datos.slice(0, 150).map(r => {
    const des = desglosarReporte(r);
    const hora = (r.hora || '').substring(0, 16);
    const ubiCorta = r.ubi ? r.ubi.substring(0, 24) : 'Sin GPS';
    const folioStr = r.folio || ('KUC-' + String(r.id).padStart(5, '0'));
    const est = r.estado_ticket || 'Reportada';
    const estColor = est === 'Reparada' ? '#10b981' : (est === 'En Revisión' ? '#f59e0b' : '#9B2247');
    const estBadge = `<span style="font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; background:${estColor}22; color:${estColor}; border:1px solid ${estColor};">${est}</span>`;

    const autorBadge = des.esDemo
      ? `<span class="badge-autor badge-autor-demo">Versión Demo</span>`
      : `<span class="badge-autor badge-autor-oficial">Cuenta: ${escapeHtml(des.usuarioLabel)}</span>`;

    const thumbHtml = des.fotoUrl
      ? `<div class="card-thumb-box" title="Clic para ampliar foto" onclick="event.stopPropagation(); abrirModalFotoId(${r.id})">
           <img src="${des.fotoUrl}" class="card-thumb" alt="Foto luminaria" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'card-thumb-placeholder\\'>Foto no disponible</span>';">
         </div>`
      : `<div class="card-thumb-box" title="Sin fotografía adjunta">
           <div class="card-thumb-placeholder">
             <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
             <span>Sin foto</span>
           </div>
         </div>`;

    const refHtml = des.referencia
      ? `<div class="card-ref-box"><span class="card-ref-label">Referencia:</span> ${escapeHtml(des.referencia)}</div>`
      : '';

    return `<div class="reporte-card" id="card-${r.id}" onclick="seleccionarReporte(${r.id})">
      ${thumbHtml}
      <div class="card-info">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px;">
          <div class="card-titulo" title="Folio ${folioStr}">${folioStr}</div>
          <div style="display:flex; align-items:center; gap:4px;">
            ${estBadge}
            ${autorBadge}
          </div>
        </div>
        <div class="card-falla-box">
          <span class="card-falla-label">Falla:</span>${escapeHtml(des.fallaEscrita)}
        </div>
        ${refHtml}
        <div class="card-meta">
          <span>${hora}</span>
          <span>&middot;</span>
          <span style="color:var(--cyan); cursor:pointer;" title="Clic para ubicar en mapa">${ubiCorta}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Renderizado de Marcadores en el Mapa ──────────────────────────
function renderMapa() {
  if (!mapaActivo || !markersLayer) return;
  markersLayer.clearLayers();
  markersMap = {};
  const datos = reportesFiltrados();
  const bounds = [];

  datos.forEach(r => {
    if (!r.ubi || !r.ubi.includes(',')) return;
    const [lat, lon] = r.ubi.split(',').map(parseFloat);
    if (isNaN(lat) || isNaN(lon)) return;

    const des = desglosarReporte(r);
    const hora = (r.hora || '').substring(0, 16);
    const folioStr = r.folio || ('KUC-' + String(r.id).padStart(5, '0'));
    const est = r.estado_ticket || 'Reportada';
    const estColor = est === 'Reparada' ? '#10b981' : (est === 'En Revisión' ? '#f59e0b' : '#9B2247');
    const estBadge = `<span style="font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; background:${estColor}22; color:${estColor}; border:1px solid ${estColor};">${est}</span>`;

    const marker = L.marker([lat, lon], { icon: getMarkerIcon(est) });

    const autorBadge = des.esDemo
      ? `<span class="badge-autor badge-autor-demo">Versión Demo</span>`
      : `<span class="badge-autor badge-autor-oficial">Cuenta: ${escapeHtml(des.usuarioLabel)}</span>`;

    const fotoImg = des.fotoUrl
      ? `<img src="${des.fotoUrl}" alt="Evidencia" title="Clic para ampliar foto" onclick="abrirModalFotoId(${r.id})" onerror="this.style.display='none';">`
      : '';

    const refP = des.referencia
      ? `<p style="font-size:11px; margin-top:3px;"><strong style="color:var(--dorado-accent);">Referencia:</strong> ${escapeHtml(des.referencia)}</p>`
      : '';

    marker.bindPopup(`
      <div class="popup-body">
        <div class="popup-header-badges" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          ${estBadge}
          ${autorBadge}
        </div>
        <h4>${folioStr}</h4>
        <div class="popup-falla-box">
          <strong style="color:#ff809b;">Falla:</strong> ${escapeHtml(des.fallaEscrita)}
        </div>
        ${refP}
        <p style="font-size:10px; margin-top:4px; color:var(--text-muted);">${hora}</p>
        ${fotoImg}
        <a class="popup-coords" target="_blank" href="https://www.google.com/maps?q=${lat},${lon}">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          ${lat.toFixed(5)}, ${lon.toFixed(5)} &mdash; Ver en Google Maps
        </a>
        <div style="margin-top:10px; pt-2; border-top:1px solid rgba(255,255,255,0.1); display:flex; gap:6px;">
          <button type="button" onclick="cambiarEstadoLuminaria(${r.id}, 'En Revisión')" style="flex:1; font-size:10px; font-weight:700; padding:5px 6px; border-radius:4px; background:rgba(245,158,11,0.15); border:1px solid #f59e0b; color:#f59e0b; cursor:pointer;">En Revisión</button>
          <button type="button" onclick="cambiarEstadoLuminaria(${r.id}, 'Reparada')" style="flex:1; font-size:10px; font-weight:700; padding:5px 6px; border-radius:4px; background:rgba(16,185,129,0.15); border:1px solid #10b981; color:#10b981; cursor:pointer;">Reparada</button>
        </div>
      </div>
    `, { maxWidth: 280 });

    marker.on('click', () => {
      document.querySelectorAll('.reporte-card').forEach(c => c.classList.remove('selected'));
      const card = document.getElementById('card-' + r.id);
      if (card) {
        card.classList.add('selected');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });

    markersLayer.addLayer(marker);
    markersMap[r.id] = marker;
    bounds.push([lat, lon]);
  });

  if (bounds.length > 0 && filtroActivo === 'todos' && !window.__mapaInicializadoBounds) {
    mapaActivo.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
    window.__mapaInicializadoBounds = true;
  }
}

// ── Seleccionar reporte (centrar mapa y abrir popup) ───────────────
function seleccionarReporte(id) {
  document.querySelectorAll('.reporte-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.add('selected');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const r = todosReportes.find(item => item.id === id);
  if (r && r.ubi && r.ubi.includes(',') && mapaActivo) {
    const [lat, lon] = r.ubi.split(',').map(parseFloat);
    if (!isNaN(lat) && !isNaN(lon)) {
      mapaActivo.flyTo([lat, lon], 17, { duration: 0.8 });
      setTimeout(() => {
        if (markersMap[id]) {
          markersMap[id].openPopup();
        }
      }, 400);
    }
  }
}

// ── Visor de Fotografía en Modal ──────────────────────────────────
function abrirModalFotoId(id) {
  const r = todosReportes.find(item => item.id === id);
  if (!r) return;
  const des = desglosarReporte(r);
  abrirModalFoto(des.fotoUrl, des.tipoIA, des.usuarioLabel, des.esDemo);
}

function abrirModalFoto(url, titulo, autor, esDemo) {
  const modal = document.getElementById('foto-modal');
  const img   = document.getElementById('foto-modal-img');
  const tit   = document.getElementById('foto-modal-titulo');
  const aut   = document.getElementById('foto-modal-autor');
  const link  = document.getElementById('foto-modal-link');

  if (!modal || !img) return;
  img.src = url || '';
  if (tit) tit.textContent = titulo || 'Evidencia Fotográfica';
  if (aut) {
    aut.textContent = esDemo ? 'Versión Demo' : 'Cuenta: ' + autor;
    aut.className = 'badge-autor ' + (esDemo ? 'badge-autor-demo' : 'badge-autor-oficial');
  }
  if (link) link.href = url || '#';
  modal.style.display = 'flex';
}

function cerrarModalFoto() {
  const modal = document.getElementById('foto-modal');
  if (modal) modal.style.display = 'none';
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cerrarModalFoto();
});

// ── Alternar Tema (Modo Oscuro / Modo Claro) ─────────────────────
function alternarTemaDashboard() {
  const esOscuro = !document.body.classList.contains('theme-light');
  const nuevo = esOscuro ? 'light' : 'dark';
  aplicarTemaDashboard(nuevo);
  localStorage.setItem('kuche_theme_pref', nuevo);
}

function aplicarTemaDashboard(tema) {
  document.body.classList.remove('theme-dark', 'theme-light');
  document.body.classList.add(tema === 'light' ? 'theme-light' : 'theme-dark');

  const btn = document.getElementById('btn-theme-toggle');
  if (btn) btn.innerHTML = tema === 'light' ? 'Modo Oscuro' : 'Modo Claro';

  const mapEl = document.getElementById('map');
  if (mapEl) {
    if (tema === 'light') {
      mapEl.classList.remove('dark-tiles');
    } else {
      mapEl.classList.add('dark-tiles');
    }
  }

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', tema === 'light' ? '#FFFFFF' : '#131113');
}

// ── Inicialización ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const guardado = localStorage.getItem('kuche_theme_pref') || 'dark';
  aplicarTemaDashboard(guardado);
  inicializarMapa();
  cargarDatos();
  setInterval(cargarDatos, 15000);
});

window.addEventListener('storage', (e) => {
  if (e.key === 'kuche_theme_pref') {
    aplicarTemaDashboard(e.newValue || 'dark');
  }
});

// Registro de Service Worker para PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js')
      .then(reg => console.log('[PWA Dashboard Kuche] Service Worker activo:', reg.scope))
      .catch(err => console.warn('[PWA Dashboard Kuche] Error:', err));
  });
}
</script>
